# KnowMate-408 纯 CPU 模式（无 NVIDIA GPU 时使用）
# 差异：关闭 rerank 与查询改写（避免加载重型模型），其余功能不变。
# 用法：docker compose -f docker-compose.cpu.yml up -d --build

services:
  ollama:
    image: ollama/ollama:latest
    container_name: knowmate-ollama
    restart: unless-stopped
    environment:
      OLLAMA_MODELS_TO_PULL: "qwen2.5:7b,bge-m3"
      OLLAMA_KEEP_ALIVE: "10m"
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh:ro
      - ollama_models:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: knowmate-backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      RERANKER_MODEL: "/models/bge-reranker-v2-m3"
      RERANK_ENABLED: "false"
      QUERY_REWRITE_ENABLED: "false"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_API_MODEL: "${DEEPSEEK_API_MODEL:-deepseek-chat}"
    volumes:
      - D:/models/bge-reranker-v2-m3:/models/bge-reranker-v2-m3:ro
      - ./data:/app/data:ro
      - kb_storage:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/status', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: knowmate-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  ollama_models:
  kb_storage:
